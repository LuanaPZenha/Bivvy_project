# Orchestrates independently deployable services.
# Each service owns its own package.json, Dockerfile, and dependency tree.
services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      CORE_SERVICE_URL: http://core-service:3002
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      - auth-service
      - core-service
    networks:
      - bivvy-net
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    expose:
      - "3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://bivvy:bivvy@postgres:5432/bivvy_auth}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SEED_DEMO_USER: ${SEED_DEMO_USER:-true}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@bivvy.test}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-BivvyDemo123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bivvy-net
    restart: unless-stopped

  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    expose:
      - "3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: ${CORE_DATABASE_URL:-postgresql://bivvy:bivvy@postgres:5432/bivvy_core}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bivvy-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bivvy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bivvy}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bivvy"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bivvy-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - bivvy-net

volumes:
  postgres-data:
  redis-data:

networks:
  bivvy-net:
    driver: bridge
