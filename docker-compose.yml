services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-compose-change-me}
      SEED_DEMO_USER: "true"
      DEMO_USER_EMAIL: demo@bivvy.test
      DEMO_USER_PASSWORD: BivvyDemo123
    restart: unless-stopped
