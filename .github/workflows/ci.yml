name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "backend/**/*.js" "mobile/src/**/*.{ts,tsx}" --max-warnings 50

      - name: Format check
        run: npx prettier --check "backend/**/*.{js,json}" "mobile/src/**/*.{ts,tsx}" "package.json" "docker-compose.yml"

      - name: Backend tests
        run: npm run test:backend
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci_test_access_secret_min_32_chars
          JWT_REFRESH_SECRET: ci_test_refresh_secret_min_32_chars

      - name: Mobile tests
        run: npm run test:mobile

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API Gateway
        run: docker build -t bivvy-api-gateway -f ./backend/api-gateway/Dockerfile ./backend

      - name: Build Auth Service
        run: docker build -t bivvy-auth-service -f ./backend/auth-service/Dockerfile ./backend

      - name: Build Core Service
        run: docker build -t bivvy-core-service -f ./backend/core-service/Dockerfile ./backend
